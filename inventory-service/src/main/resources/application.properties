

spring.application.name=inventory-service

server.port=8084

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/shopsphere_inventory?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info



spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest


spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

spring.kafka.consumer.properties[spring.json.value.default.type]=com.shopsphere.inventory.event.OrderCreatedEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false